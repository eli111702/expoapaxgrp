    /* "DEC 2026" heading: one line, scaled to fit the panel width */
    .dec-title { font-size: min(12vw, 150px); }
    /* "DEC 2026" with "TALK TO EXPERT" beside it; wraps below when there isn't room */

    /* "TALK TO EXPERT" boxed button beside the DEC 2026 heading */
    .tte-btn { border: 2px solid #000; color: #000; background: transparent; padding: 0.6rem 1.5rem;
      font-weight: 700; font-size: 0.875rem; letter-spacing: 0.2em; white-space: nowrap;
      cursor: pointer; transition: background-color .3s, color .3s; }
    .tte-btn:hover, .tte-btn:focus-visible { background: #000; color: #fff; }
    /* Animated light that runs around the TALK TO EXPERT border */
    @property --tte-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
    .tte-btn { position: relative; }
    .tte-btn::before { content: ""; position: absolute; inset: -2px; padding: 3px; pointer-events: none;
      background: conic-gradient(from var(--tte-angle), transparent 0deg 250deg, rgba(255,255,255,.35) 300deg, #fff 345deg, transparent 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      animation: tte-run 2.5s linear infinite; }
    .tte-btn:hover::before { opacity: 0; }
    @keyframes tte-run { to { --tte-angle: 360deg; } }

    .apax-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 2rem; }
    .apax-gallery button { display: block; padding: 0; border: 0; background: none; cursor: zoom-in;
      border-radius: 0.5rem; overflow: hidden; transition: transform .3s ease, box-shadow .3s ease; }
    .apax-gallery img { display: block; width: 100%; height: auto; aspect-ratio: 5 / 4; object-fit: cover; object-position: top; }
    .apax-gallery button:hover, .apax-gallery button:focus-visible {

    .apax-video { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; border-radius: 0.5rem;

    .apax-video img { display: block; width: 100%; height: 100%; object-fit: cover; }

    .apax-video-play { position: absolute; left: 50%; top: 50%; width: 3.25rem; height: 3.25rem; margin: -1.625rem 0 0 -1.625rem;

    .apax-video-play::after { content: ""; position: absolute; left: 55%; top: 50%; transform: translate(-50%, -50%);
      border-style: solid; border-width: 0.6rem 0 0.6rem 1rem; border-color: transparent transparent transparent #fff; }
    .apax-video.previewing .apax-video-play { opacity: 0; }
    .apax-video:hover, .apax-video:focus-visible { transform: scale(1.08); box-shadow: 0 10px 25px rgba(0,0,0,.35); z-index: 3; outline: none; }
    .apax-lightbox.video { align-items: center; }
    .apax-lightbox-video { width: min(95vw, calc((100vh - 7rem) * 16 / 9), 1400px); aspect-ratio: 16 / 9; margin: auto; cursor: default; }
    .apax-lightbox-video iframe { width: 100%; height: 100%; border: 0; border-radius: 0.25rem; }
    @media (prefers-reduced-motion: reduce) { .apax-gallery button, .apax-video { transition: none; } }

  <script>
    // Posters and videos open in a large overlay; close with the X, Esc or a click outside.
    // Videos also zoom and play a muted preview while hovered with a mouse.
    (function () {
      function openOverlay(content, extraClass, returnFocus) {
        var box = document.createElement('div');
        box.className = 'apax-lightbox' + (extraClass ? ' ' + extraClass : '');
        box.setAttribute('role', 'dialog');
        box.setAttribute('aria-modal', 'true');
        var close = document.createElement('button');
        close.className = 'apax-lightbox-close';
        close.setAttribute('aria-label', 'Close');
        close.innerHTML = '&times;';
        box.appendChild(close);
        box.appendChild(content);
        function shut() { box.remove(); document.removeEventListener('keydown', onKey); if (returnFocus) returnFocus.focus(); }
        function onKey(ev) { if (ev.key === 'Escape') shut(); }
        box.addEventListener('click', function (ev) { if (!content.contains(ev.target)) shut(); });
        document.addEventListener('keydown', onKey);
        document.body.appendChild(box);
        close.focus();
        return box;
      }

      function ytSrc(id, preview) {
        var q = preview
          ? 'autoplay=1&mute=1&controls=0&playsinline=1&loop=1&playlist=' + id + '&rel=0'
          : 'autoplay=1&playsinline=1&rel=0';
        return 'https://www.youtube-nocookie.com/embed/' + id + '?' + q;
      }

      var hoverTimer = null;
      function startPreview(card) {
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(function () {
          if (card.querySelector('.apax-preview')) return;
          var f = document.createElement('iframe');
          f.className = 'apax-preview';
          f.src = ytSrc(card.getAttribute('data-yt'), true);
          f.allow = 'autoplay; encrypted-media';
          f.tabIndex = -1;
          f.setAttribute('aria-hidden', 'true');
          card.appendChild(f);
          card.classList.add('previewing');
        }, 250);
      }
      function stopPreview(card) {
        clearTimeout(hoverTimer);
        var f = card.querySelector('.apax-preview');
        if (f) f.remove();
        card.classList.remove('previewing');
      }

      document.addEventListener('pointerover', function (e) {
        if (e.pointerType !== 'mouse') return;
        var card = e.target.closest && e.target.closest('.apax-video');
        if (card && !card.contains(e.relatedTarget)) startPreview(card);
      });
      document.addEventListener('pointerout', function (e) {
        var card = e.target.closest && e.target.closest('.apax-video');
        if (card && !card.contains(e.relatedTarget)) stopPreview(card);
      });

      document.addEventListener('click', function (e) {
        if (!e.target.closest) return;
        var card = e.target.closest('.apax-video');
        if (card) {
          stopPreview(card);
          var wrap = document.createElement('div');
          wrap.className = 'apax-lightbox-video';
          var f = document.createElement('iframe');
          f.src = ytSrc(card.getAttribute('data-yt'), false);
          f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
          f.allowFullscreen = true;
          f.title = card.getAttribute('aria-label');
          wrap.appendChild(f);
          openOverlay(wrap, 'video', card);
          return;
        }
        var btn = e.target.closest('.apax-gallery [data-full]');
        if (btn) {
          var img = new Image();
          img.alt = btn.querySelector('img').alt;
          var box = openOverlay(img, '', btn);
          img.onload = function () { if (img.naturalHeight / img.naturalWidth > 1.5) box.classList.add('tall'); };
          img.src = btn.getAttribute('data-full');
        }
      });
    })();
  </script>

    <!-- APAX XGRIDS AI assistant (ElevenLabs Agents). Agent settings live in the ElevenLabs dashboard. -->
    <elevenlabs-convai agent-id="agent_4801m7kyf9hzf1crt59x7qrdedbd"
      text-contents='{"main_label":"OBI","start_call":"Talk to OBI","start_chat":"Chat"}'></elevenlabs-convai>
    <script>
      // Show OBI's own language picker (flag button) with English, Bahasa Melayu and 中文.
      // The agent's published ElevenLabs settings currently list no picker languages, so add them to the
      // widget settings as they load. Choosing BM/中文 needs "Language" overrides allowed in the agent's Security settings.
      (function () {
        var LANGS = ['en', 'ms', 'zh'];
        var realFetch = window.fetch;
        window.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          var p = realFetch.apply(this, arguments);
          if (!/\/v1\/convai\/agents\/[^/?]+\/widget/.test(url)) return p;
          return p.then(function (res) {
            if (!res.ok) return res;
            return res.clone().json().then(function (data) {
              var cfg = data && data.widget_config;
              if (cfg && !(cfg.supported_language_overrides && cfg.supported_language_overrides.length)) {
                cfg.supported_language_overrides = LANGS;
              }
              return new Response(JSON.stringify(data), { status: res.status, statusText: res.statusText, headers: res.headers });
            }).catch(function () { return res; });
          });
        };
      })();
    </script>
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed@0.23.0" async type="text/javascript"></script>
